# Production / demo-server stack: PostGIS + API + Caddy (web + HTTPS).
# Usage: docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: maha_passport
      POSTGRES_USER: maha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maha -d maha_passport"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: the database is reachable only from the API container.

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://maha:${POSTGRES_PASSWORD}@db:5432/maha_passport
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_MOBILE: ${DEMO_MOBILE:-}
      DEMO_OTP: ${DEMO_OTP:-}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
